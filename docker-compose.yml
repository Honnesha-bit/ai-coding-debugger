services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-coding-debugger:latest
    container_name: ai-coding-debugger
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/debugger.sqlite
      - SESSION_SECRET=${SESSION_SECRET}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - AI_FALLBACK_PROVIDER=${AI_FALLBACK_PROVIDER:-auto}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gemini-flash-latest}
      - SANDBOX_MODE=container
      - SANDBOX_IMAGE=ai-coding-debugger-sandbox:latest
      - TRUST_PROXY=${TRUST_PROXY:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      # Persistent SQLite database volume
      - debugger_data:/app/data
      # Docker socket mount for isolated sandbox container execution
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  debugger_data:
    driver: local
